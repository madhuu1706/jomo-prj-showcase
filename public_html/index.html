<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1a2c">
<title>JOMO Portfolio</title>
<style>
:root{
  --bg:#0e1a2c; --bg-2:#152238; --card:#1c2f4d; --card-2:#243a5e;
  --fg:#ffffff; --fg-soft:rgba(255,255,255,.72); --fg-faint:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.12); --gold:#d8ad5f; --gold-hi:#e8c988; --gold-lo:#c99a45;
  --gold-line:rgba(216,173,95,.35); --on-gold:#152238;
  --shadow:0 12px 30px rgba(9,15,28,.35); --nav-bg:rgba(14,26,44,.86);
  --logo:url(assets/logo.png);
  --radius:14px;
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;padding-inline:16px}
.wrap{max-width:1180px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* top bar */
.top{background:var(--bg);margin-inline:-16px;padding:14px 16px;border-bottom:1px solid var(--gold-line)}
.logo{display:block;width:190px;aspect-ratio:560/214;background:var(--logo) center/contain no-repeat;border:0;padding:0;cursor:pointer}

/* home */
.hero{padding-block:36px 28px;display:grid;gap:14px;max-width:760px}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--fg-soft);font-size:17px;max-width:56ch}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.ccard:hover,.ccard:focus-visible{transform:translateY(-3px);border-color:var(--gold-line);outline:none}
.ccard .cover{aspect-ratio:4/3;width:100%;display:block;object-fit:cover}
.cwrap{position:relative;display:block}
.badge{position:absolute;left:6px;top:6px;background:#fff;border-radius:6px;padding:3px 6px;display:flex;line-height:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.badge img{height:24px;width:auto;display:block}
.chead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.chead .badge{position:static;border-radius:8px;padding:5px 9px}
.chead .badge img{height:34px}
.ccard .body{padding:14px 16px 16px;display:grid;gap:4px}
.ccard h3{font-size:19px}

/* client page */
.back{background:none;border:0;padding:8px 0;color:var(--fg-soft);font-size:14px;display:inline-flex;gap:6px}
.back:hover{color:var(--gold)}
.chead{padding-block:10px 18px}
.chead h1{font-size:clamp(26px,4.5vw,40px);font-weight:700;color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding-bottom:48px}
.gal button{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.gal button:hover img{transform:scale(1.03)}

/* lightbox */
.lb{position:fixed;inset:0;height:100dvh;touch-action:pan-y pinch-zoom;overscroll-behavior:contain;z-index:50;background:rgba(6,11,20,.94);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.lb[hidden]{display:none}
.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;color:#fff;font-size:14px}
.lb .stage{min-height:0;position:relative;overflow:hidden}
.lb .stage img{user-select:none;-webkit-user-drag:none;position:absolute;inset:0;width:100%;height:100%;border-radius:0;object-fit:contain}
.lb button.x,.lb button.nv{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;width:42px;height:42px;font-size:20px}
.lb .nv{position:absolute;top:50%;translate:0 -50%}
.lb .prev{left:0}.lb .next{right:0}
.lb .cap2{color:#fff;text-align:center;padding:12px;font-size:14px}
@media (max-width:520px){.logo{width:150px}}
@media (hover:none){.ccard:hover,.ccard:focus-visible{transform:none}.gal button:hover img{transform:none}}
.back,.lb button{min-height:44px}
.back{padding-inline:0 12px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* sizing + mobile */
.grid{display:grid;margin-top:28px;padding-bottom:64px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}
.ccard .cover{aspect-ratio:1/1;height:auto}
.ccard .body{padding:12px 14px 14px}
.ccard h3{font-size:16px;color:var(--gold)}
.hero{padding-block:30px 8px}
.hero h1{font-size:clamp(28px,5vw,44px)}
@media (max-width:700px){
  .top{padding:10px 16px}
  .logo{width:112px}
  .hero{padding-block:14px 4px;gap:4px}
  .hero .eyebrow,.hero p{display:none}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-bottom:24px}
  .ccard{border-radius:10px}
  .ccard .cover{aspect-ratio:4/3}
  .badge{left:4px;top:4px;padding:2px 4px;border-radius:5px}
  .badge img{height:20px}
  .chead .badge img{height:28px}
  .ccard .body{padding:6px 6px 8px}
  .ccard h3{font-size:12px;line-height:1.25;overflow-wrap:anywhere}
  .chead{padding-block:2px 12px}
  .gal{padding-bottom:32px}
  .lb{padding-inline:0}
  .lb .stage img{border-radius:0}
  .lb .nv{width:48px;height:48px;background:rgba(6,11,20,.55)}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
</style>
<link rel="icon" href="assets/logo.png">
</head><body>
<header class="top"><div class="wrap"><button class="logo" id="home-logo" aria-label="JOMO Home Interiors, back to all projects"></button></div></header>
<div class="wrap">
  <main id="app"></main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="bar"><span id="lb-count"></span><button class="x" id="lb-close" aria-label="Close">✕</button></div>
  <div class="stage" id="lb-stage"></div>
  <div class="cap2" id="lb-cap"></div>
</div>

/* each client: {id,name,cover,images:[{n,tw,th,fw,fh}]}  ->  assets/<id>/thumb/<n>.webp and assets/<id>/full/<n>.webp */
const A = 'assets/';
const thumb = (c,i) => `${A}${c.id}/thumb/${i.n}.webp`;
const bimg  = b => `${A}builders/${b.f}.${b.e}`;
const badge = (b,cls) => b ? `<span class="badge"><img src="${bimg(b)}" alt="${esc(b.f)} builder logo" width="${b.w}" height="${b.h}" decoding="async"></span>` : '';
const full  = (c,i) => `${A}${c.id}/full/${i.n}.webp`;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIRST_SCREEN = 12;

function home(){
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">Our projects</span>
    <h1>Crafting homes where you <em>belong.</em></h1>
    <p>Explore our completed projects.</p>
  </section>
  <div class="grid">${CLIENTS.map((c,k)=>{
    const i=c.images[0], eager=k<FIRST_SCREEN;
    return `<button class="ccard" data-id="${c.id}">
      <span class="cwrap"><img class="cover" alt="${esc(c.label)}" src="${thumb(c,i)}" width="${i.tw}" height="${i.th}" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async">${badge(c.builder)}</span>
      <span class="body"><h3>${esc(c.label)}</h3></span>
    </button>`}).join('')}</div>`;
  app.querySelectorAll('.ccard').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
}

function client(c){
  app.innerHTML = `
  <button class="back" id="back">← All projects</button>
  <section class="chead"><h1>${esc(c.label)}</h1>${badge(c.builder)}</section>
  <div class="gal">${c.images.map((it,i)=>`<button data-i="${i}" aria-label="Open photo ${i+1}"><img alt="${esc(c.label)} ${i+1}" src="${thumb(c,it)}" width="${it.tw}" height="${it.th}" ${i<8?'':'loading="lazy" '}decoding="async"></button>`).join('')}</div>`;
  document.getElementById('back').onclick=()=>{location.hash=''};
  app.querySelectorAll('.gal button').forEach(b=>b.onclick=()=>openLB(c,+b.dataset.i));
}

/* ───────── LIGHTBOX ───────── */
const lb=document.getElementById('lb'), stage=document.getElementById('lb-stage');
let cur=null;
function openLB(c,i){ cur={c,i}; renderLB(); lb.hidden=false; document.body.style.overflow='hidden'; document.getElementById('lb-close').focus(); }
function renderLB(){
  const {c,i}=cur, items=c.images, it=items[i];
  document.getElementById('lb-count').textContent=`${i+1} / ${items.length}`;
  document.getElementById('lb-cap').textContent=c.label;
  const nav=items.length>1?`<button class="nv prev" aria-label="Previous">‹</button><button class="nv next" aria-label="Next">›</button>`:'';
  stage.innerHTML=`<img alt="${esc(c.label)} ${i+1}" src="${full(c,it)}" width="${it.fw}" height="${it.fh}" decoding="async">${nav}`;
  const p=stage.querySelector('.prev'), n=stage.querySelector('.next');
  if(p) p.onclick=()=>step(-1); if(n) n.onclick=()=>step(1);
  if(items.length>1) new Image().src=full(c,items[(i+1)%items.length]);   // preload next
}
function step(d){ cur.i=(cur.i+d+cur.c.images.length)%cur.c.images.length; renderLB(); }
function closeLB(){ lb.hidden=true; document.body.style.overflow=''; cur=null; }
document.getElementById('lb-close').onclick=closeLB;
lb.addEventListener('click',e=>{ if(e.target===lb||e.target===stage) closeLB(); });
document.addEventListener('keydown',e=>{ if(lb.hidden) return; if(e.key==='Escape') closeLB(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });

let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches.length===1?e.touches[0].clientX:null},{passive:true});
stage.addEventListener('touchend',e=>{ if(tx===null||!cur) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50) step(dx<0?1:-1); },{passive:true});

/* ───────── ROUTER ───────── */
function route(){
  if(cur) closeLB();
  const c=CLIENTS.find(x=>x.id===decodeURIComponent(location.hash.replace(/^#/,'')));
  if(c){ client(c); window.scrollTo(0,0); } else home();
}
document.getElementById('home-logo').onclick=()=>{ location.hash=''; route(); window.scrollTo(0,0); };
window.addEventListener('hashchange',route);
route();
</script>
