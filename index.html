:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;padding-inline:16px}
.wrap{max-width:1180px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* top bar */
.top{background:var(--bg);margin-inline:-16px;padding:14px 16px;border-bottom:1px solid var(--gold-line)}
.logo{display:block;width:190px;aspect-ratio:560/214;background:var(--logo) center/contain no-repeat;border:0;padding:0;cursor:pointer}

/* home */
.hero{padding-block:36px 28px;display:grid;gap:14px;max-width:760px}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--fg-soft);font-size:17px;max-width:56ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:6px;padding-top:16px;border-top:1px solid var(--gold-line);font-size:14px;color:var(--fg-soft)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:18px;margin-right:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-block:22px 18px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;color:var(--fg-soft)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.grid{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px;padding-bottom:64px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.ccard:hover,.ccard:focus-visible{transform:translateY(-3px);border-color:var(--gold-line);outline:none}
.ccard .cover{aspect-ratio:4/3;width:100%;display:block;object-fit:cover}
.ccard .body{padding:14px 16px 16px;display:grid;gap:4px}
.ccard h3{font-size:19px}
.ccard .meta{font-size:13px;color:var(--fg-faint)}
.ccard .counts{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}

/* client page */
.back{background:none;border:0;padding:8px 0;color:var(--fg-soft);font-size:14px;display:inline-flex;gap:6px}
.back:hover{color:var(--gold)}
.chead{padding-block:10px 18px;display:grid;gap:8px}
.chead h1{font-size:clamp(30px,5.5vw,48px);font-weight:700}
.chead .meta{color:var(--fg-soft);display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.chead .meta span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--gold);margin-right:18px;vertical-align:middle}
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:10px 16px;border-block:1px solid var(--line)}
.subnav .row{max-width:1180px;margin-inline:auto;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.subnav .row::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--gold-line);background:transparent;border-radius:999px;padding:9px 20px;font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--fg)}
.pill:hover{border-color:var(--gold)}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.sec{padding-top:44px;scroll-margin-top:76px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sec h2{font-size:24px}
.sec header span{font-size:13px;color:var(--fg-faint)}
.sec .desc{margin:-4px 0 16px;color:var(--fg-soft);max-width:62ch}
.player{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--bg-2);border:1px solid var(--line);aspect-ratio:16/9;width:100%;padding:0;display:block;box-shadow:var(--shadow)}
.player img,.vcard img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,transparent 40%,rgba(9,15,28,.65))}
.play i{width:64px;height:64px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.play i::after{content:"";border-style:solid;border-width:10px 0 10px 17px;border-color:transparent transparent transparent var(--on-gold);margin-left:4px}
.dur{position:absolute;right:12px;bottom:12px;background:rgba(9,15,28,.75);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0}
.vcard .thumb{position:relative;aspect-ratio:16/9}
.vcard .cap{padding:10px 14px 12px;font-size:14px}
.shoot{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.shoot button:first-child{grid-column:1/-1}
.shoot button{padding:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);aspect-ratio:16/10}
.shoot img,.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.shoot button:hover img,.gal button:hover img{transform:scale(1.03)}
.gal{columns:3 220px;column-gap:12px}
.gal button{display:block;width:100%;margin-bottom:12px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.empty{padding:28px;border:1px dashed var(--gold-line);border-radius:var(--radius);color:var(--fg-faint);text-align:center}
.foot{padding-block:48px 40px;color:var(--fg-faint);font-size:13px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:56px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(6,11,20,.94);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.lb[hidden]{display:none}
.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;color:#fff;font-size:14px}
.lb .stage{display:grid;place-items:center;min-height:0;position:relative}
.lb .stage img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.lb .vid{width:min(100%,960px);aspect-ratio:16/9;position:relative;border-radius:12px;overflow:hidden}
.lb .vid img{width:100%;height:100%;object-fit:cover}
.lb .note{position:absolute;inset:auto 0 0 0;padding:14px;background:rgba(9,15,28,.8);color:#fff;font-size:13px;text-align:center}
.lb button.x,.lb button.nv{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;width:42px;height:42px;font-size:20px}
.lb .nv{position:absolute;top:50%;translate:0 -50%}
.lb .prev{left:0}.lb .next{right:0}
.lb .cap2{color:#fff;text-align:center;padding:12px;font-size:14px}
@media (max-width:520px){.logo{width:150px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* sizing + mobile */
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}
.ccard .cover{aspect-ratio:1/1}
.ccard .body{padding:12px 14px 14px}
.ccard h3{font-size:16px;color:var(--gold)}
.chead h1,.sec h2{color:var(--gold)}
.chead h1{font-size:clamp(26px,4.5vw,40px)}
.sec h2{font-size:22px}
.player{max-width:820px}
.shoot{grid-template-columns:repeat(3,1fr);gap:12px}
.shoot button:first-child{grid-column:auto}
.gal{columns:170px;column-gap:10px}
.gal button{margin-bottom:10px}
.vgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.hero{padding-block:30px 8px}
.hero h1{font-size:clamp(28px,5vw,44px)}
@media (max-width:700px){
  .top{padding:10px 16px}
  .logo{width:112px}
  .hero{padding-block:14px 4px;gap:4px}
  .hero .eyebrow,.hero p{display:none}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-bottom:24px}
  .ccard{border-radius:10px}
  .ccard .cover{aspect-ratio:4/3}
  .ccard .body{padding:6px 6px 8px}
  .ccard h3{font-size:11px;line-height:1.25;overflow-wrap:anywhere}
  .shoot{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shoot button:first-child{grid-column:1/-1}
  .shoot button{aspect-ratio:4/3}
  .gal{columns:2 140px;column-gap:8px}
  .vgrid{grid-template-columns:1fr}
  .sec{padding-top:32px}
  .play i{width:52px;height:52px}
}
</style>
</head>
<body>


<header class="top"><div class="wrap"><button class="logo" id="home-logo" aria-label="JOMO Home Interiors, back to all projects"></button></div></header>
<div class="wrap">
  <main id="app"></main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Media viewer">
  <div class="bar"><span id="lb-count"></span><button class="x" id="lb-close" aria-label="Close">✕</button></div>
  <div class="stage" id="lb-stage"></div>
  <div class="cap2" id="lb-cap"></div>
</div>

<script>
/* ───────── DATA LAYER ─────────
   Everything the site shows comes from loadClients().
   Today it returns sample data. When AWS is connected, replace the body with:
     const r = await fetch(API_URL + '/clients'); return r.json();
   (API Gateway -> Lambda -> DynamoDB; media URLs point at CloudFront/S3.)
   Media item shape: { title, src?, duration? } — if `src` is missing, a placeholder is drawn. */
const PALETTES = [
  ['#2c4a73','#d8ad5f','#152238'],['#243a5e','#e8c988','#101c30'],['#1c2f4d','#c99a45','#152238'],
  ['#2c4a73','#e8c988','#0e1a2c'],['#243a5e','#d8ad5f','#152238'],['#1c2f4d','#e0b878','#101c30']];
const ROOMS = ['Living room','Master bedroom','Modular kitchen','Dining area','Foyer','Kids room','Pooja unit','Balcony','Study','Wardrobe wall','TV unit','Guest bedroom'];
function art(seed, label, w=800, h=600){
  const p = PALETTES[seed % PALETTES.length], k = seed * 37;
  const sx = 60 + (k % 120), sy = 120 + (k % 90);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient>
  <radialGradient id="l" cx=".7" cy=".15" r=".6"><stop offset="0" stop-color="${p[1]}" stop-opacity=".55"/><stop offset="1" stop-color="${p[1]}" stop-opacity="0"/></radialGradient></defs>
  <rect width="${w}" height="${h}" fill="url(#g)"/><rect width="${w}" height="${h}" fill="url(#l)"/>
  <rect x="0" y="${h*.72}" width="${w}" height="${h*.28}" fill="#000" opacity=".28"/>
  <rect x="${sx}" y="${h*.5}" width="${w*.42}" height="${h*.22}" rx="14" fill="${p[1]}" opacity=".85"/>
  <rect x="${sx+16}" y="${h*.42}" width="${w*.42-32}" height="${h*.12}" rx="12" fill="${p[1]}" opacity=".6"/>
  <rect x="${w*.62}" y="${h*.18}" width="${w*.26}" height="${h*.42}" rx="6" fill="none" stroke="${p[1]}" stroke-width="3" opacity=".7"/>
  <line x1="${w*.75}" y1="${h*.18}" x2="${w*.75}" y2="${h*.6}" stroke="${p[1]}" stroke-width="2" opacity=".5"/>
  <circle cx="${sx+w*.42+50}" cy="${sy}" r="${18+(k%14)}" fill="${p[1]}" opacity=".35"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function mk(id,name,loc,type,area,year,seed,counts){
  const m = (n,off,prefix,dur)=>Array.from({length:n},(_,i)=>({title:prefix?`${prefix} ${i+1}`:ROOMS[(i+off)%ROOMS.length],duration:dur?dur[i%dur.length]:undefined,seed:seed+off+i}));
  return {id,name,loc,type,area,year,seed,
    walkthrough: counts[0]?m(1,0,'Walkthrough',['6:42']):[],
    shoot: m(counts[1],3,null),
    images: m(counts[2],1,null),
    videos: m(counts[3],5,'Feature clip',['0:48','1:12','0:35','2:05'])};
}
async function loadClients(){
  return [
    mk('sharma-residence','Sharma Residence','Bengaluru','3 BHK apartment','1,650 sq ft',2025,0,[1,3,9,3]),
    mk('iyer-villa','Iyer Villa','Chennai','4 BHK villa','3,200 sq ft',2025,1,[1,3,12,4]),
    mk('menon-penthouse','Menon Penthouse','Kochi','Penthouse','2,400 sq ft',2024,2,[1,3,8,2]),
    mk('reddy-home','Reddy Home','Hyderabad','3 BHK apartment','1,480 sq ft',2024,3,[1,3,7,2]),
    mk('nair-duplex','Nair Duplex','Thiruvananthapuram','Duplex','2,100 sq ft',2024,4,[1,3,10,3]),
    mk('joseph-residence','Joseph Residence','Kottayam','3 BHK villa','2,050 sq ft',2023,6,[1,3,8,2]),
    mk('varma-heights','Varma Heights','Coimbatore','4 BHK apartment','2,300 sq ft',2023,7,[1,3,9,3]),
    mk('khan-studio','Khan Studio Flat','Mumbai','1 BHK studio','720 sq ft',2023,5,[0,3,6,1])
  ];
}

/* ───────── VIEWS ───────── */
const app = document.getElementById('app');
let CLIENTS = [], filter = 'All';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src = (it,label,w,h) => it.src || art(it.seed, 'JOMO', w, h);

function home(){
  const list = CLIENTS;
  const photos = CLIENTS.reduce((n,c)=>n+c.images.length+c.shoot.length,0);
  const vids = CLIENTS.reduce((n,c)=>n+c.videos.length+c.walkthrough.length,0);
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">Our projects</span>
    <h1>Crafting homes where you <em>belong.</em></h1>
    <p>Explore our completed projects.</p>
  </section>
  <div class="grid">${list.map(c=>`
    <button class="ccard" data-id="${c.id}">
      <img class="cover" alt="${esc(c.name)} cover" src="${art(c.seed,'JOMO')}" loading="lazy">
      <span class="body"><h3>${esc(c.name)}</h3>
        </span>
    </button>`).join('')}</div>`;
  app.querySelectorAll('.ccard').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
}

const SECS = [['walkthrough','Walkthrough'],['shoot','Project Shoot'],['images','Images'],['video','Video']];
function client(c){
  const photoSet = [...c.shoot,...c.images];
  app.innerHTML = `
  <button class="back" id="back">← All projects</button>
  <section class="chead">
    <span class="eyebrow">Client</span>
    <h1>${esc(c.name)}</h1>
  </section>
  <nav class="subnav" aria-label="Sections"><div class="row">${SECS.map(([k,l],i)=>`<button class="pill${i?'':' on'}" data-s="${k}">${l}</button>`).join('')}</div></nav>

  <section class="sec" id="s-walkthrough"><header><h2>Walkthrough</h2></header>
    ${c.walkthrough.length? `
    <button class="player" data-v="walkthrough" data-i="0" aria-label="Play walkthrough"><img alt="" src="${art(c.seed+2,'JOMO',1280,720)}"><span class="play"><i></i></span><span class="dur">${c.walkthrough[0].duration}</span></button>`
    : `<div class="empty">Walkthrough for this project is coming soon.</div>`}
  </section>

  <section class="sec" id="s-shoot"><header><h2>Project Shoot</h2></header>
    ${c.shoot.length? `<div class="shoot">${c.shoot.map((it,i)=>`<button data-p="shoot" data-i="${i}" aria-label="Open ${esc(it.title)}"><img alt="${esc(it.title)}" loading="lazy" src="${src(it,'',1200,750)}"></button>`).join('')}</div>`:`<div class="empty">Project shoot coming soon.</div>`}
  </section>

  <section class="sec" id="s-images"><header><h2>Images</h2></header>
    ${c.images.length? `<div class="gal">${c.images.map((it,i)=>`<button data-p="images" data-i="${i}" aria-label="Open ${esc(it.title)}"><img alt="${esc(it.title)}" loading="lazy" src="${art(it.seed,'JOMO',800,(i%3===0?1000:i%3===1?600:760))}" style="aspect-ratio:${i%3===0?'4/5':i%3===1?'4/3':'1/1'}"></button>`).join('')}</div>`:`<div class="empty">Photographs coming soon.</div>`}
  </section>

  <section class="sec" id="s-video"><header><h2>Video</h2></header>
    ${c.videos.length? `<div class="vgrid">${c.videos.map((it,i)=>`<button class="vcard" data-v="video" data-i="${i}"><span class="thumb" style="display:block"><img alt="" loading="lazy" src="${art(it.seed,'JOMO',800,450)}"><span class="play"><i></i></span><span class="dur">${it.duration}</span></span><span class="cap" style="display:block">${esc(it.title)}</span></button>`).join('')}</div>`:`<div class="empty">Videos coming soon.</div>`}
  </section>`;

  document.getElementById('back').onclick=()=>{location.hash=''};
  const pills=[...app.querySelectorAll('.pill')];
  pills.forEach(p=>p.onclick=()=>{
    const el=document.getElementById('s-'+p.dataset.s); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  });
  // highlight the pill for the section in view
  const obs = new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){ const k=e.target.id.slice(2); pills.forEach(p=>p.classList.toggle('on',p.dataset.s===k)); }})},{rootMargin:'-30% 0px -60% 0px'});
  app.querySelectorAll('.sec').forEach(s=>obs.observe(s));
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openLB(c, b.dataset.p, +b.dataset.i));
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>openLB(c, b.dataset.v, +b.dataset.i));
}

/* ───────── LIGHTBOX ───────── */
const lb=document.getElementById('lb'), stage=document.getElementById('lb-stage');
let cur=null;
function openLB(c, kind, i){
  const isVid = kind==='walkthrough'||kind==='video';
  const items = kind==='walkthrough'?c.walkthrough : kind==='video'?c.videos : kind==='shoot'?c.shoot : c.images;
  cur={items,kind,i,isVid,c}; renderLB(); lb.hidden=false; document.body.style.overflow='hidden';
  document.getElementById('lb-close').focus();
}
function renderLB(){
  const {items,i,isVid,kind} = cur, it=items[i];
  document.getElementById('lb-count').textContent = `${i+1} / ${items.length}`;
  document.getElementById('lb-cap').textContent = it.title + (isVid&&it.duration?` · ${it.duration}`:'');
  const nav = items.length>1 ? `<button class="nv prev" aria-label="Previous">‹</button><button class="nv next" aria-label="Next">›</button>`:'';
  stage.innerHTML = isVid
    ? `<div class="vid"><img alt="" src="${art(it.seed,'JOMO',1280,720)}"><span class="play"><i></i></span></div>${nav}`
    : `<img alt="${esc(it.title)}" src="${src(it,'',1400,1000)}">${nav}`;
  const p=stage.querySelector('.prev'), n=stage.querySelector('.next');
  if(p) p.onclick=()=>step(-1); if(n) n.onclick=()=>step(1);
}
function step(d){ cur.i=(cur.i+d+cur.items.length)%cur.items.length; renderLB(); }
function closeLB(){ lb.hidden=true; document.body.style.overflow=''; cur=null; }
document.getElementById('lb-close').onclick=closeLB;
lb.addEventListener('click',e=>{ if(e.target===lb||e.target===stage) closeLB(); });
document.addEventListener('keydown',e=>{ if(lb.hidden) return; if(e.key==='Escape') closeLB(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });

/* ───────── ROUTER ───────── */
function route(){
  if(cur) closeLB();
  const id = location.hash.replace(/^#/,'');
  const c = CLIENTS.find(x=>x.id===id);
  if(c){ client(c); window.scrollTo(0,0); } else { home(); }
}
document.getElementById('home-logo').onclick=()=>{ location.hash=''; route(); window.scrollTo(0,0); };
window.addEventListener('hashchange',route);
loadClients().then(d=>{CLIENTS=d;route();});
</script>

</body>
</html>
